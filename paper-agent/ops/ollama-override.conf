# ollama 동시 적재 설정 (생성 gemma4:31b + 검수 qwen3-coder:30b 둘 다 상주)
#
# 문제: ollama 가 CUDA_VISIBLE_DEVICES=0 으로 RTX 5090(32GB) 한 장만 사용 →
#       gemma(27GB)+qwen(22GB)=49GB 가 안 들어가 매번 스왑(재로딩) → 느림.
# 해결: RTX 3090 Ti(24GB)까지 열어 두 GPU(합 56GB)에 두 모델을 각각 상주.
#
# 주의: 기존 override.conf 의 OLLAMA_CUDA_DRIVER_VERSION 핀은 보존한다.
#
# 설치(기존 override.conf 덮어쓰기):
#   sudo cp ops/ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# 확인:  ollama ps   (gemma 와 qwen 이 동시에 떠 있어야 함)

[Service]
Environment="CUDA_VISIBLE_DEVICES=0,1"
Environment="OLLAMA_CUDA_DRIVER_VERSION=580.159.03"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
Environment="OLLAMA_KEEP_ALIVE=30m"
