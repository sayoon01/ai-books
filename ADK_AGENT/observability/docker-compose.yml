# Phoenix — LLM 관측 UI (단일 컨테이너).
# ADK 가 방출하는 OTel span 을 받아 trace waterfall·프롬프트/응답·토큰을 보여준다.
#   UI:        http://localhost:6006
#   OTLP gRPC: localhost:4317   (앱의 PHOENIX_OTLP_ENDPOINT=http://localhost:4317 가 여기로 보냄)
#   OTLP HTTP: http://localhost:6006/v1/traces
#
# 실행:  docker-compose -f observability/docker-compose.yml up -d
# 종료:  docker-compose -f observability/docker-compose.yml down   (데이터 유지)
#        ... down -v 로 볼륨까지 삭제.
#
# Langfuse 는 별도 스택: observability/langfuse/docker-compose.yml (공식 파일) 참고 — README 참조.
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: adk-phoenix
    ports:
      - "6006:6006"      # UI + OTLP HTTP
      - "4317:4317"      # OTLP gRPC
    environment:
      # 트레이스 보존(선택). 기본은 컨테이너 내부 SQLite + 볼륨에 영속.
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data
    restart: unless-stopped

volumes:
  phoenix_data:
